# This repository's settings for the upstream chart (ADR-009); values.yaml stays upstream's.
# install/release.py adds the values that come from `.env`: the database host in the JDBC URL
# and the policy endpoint. charts/test_polaris.py compares each setting with the chart default
# (ADR-016).

# Two replicas on two nodes, one always up: both sign tokens with the same key (ADR-026).
# The target clusters' counts are open (#9).
replicaCount: 2

image:
  repository: apache/polaris
  # Docker Hub index digest (docker-content-digest, recomputed), read 2026-10-11.
  tag: "1.6.0@sha256:9738b2052dea20aabf0cd42521424ff963fee41b0ee888fef9f512efb256602a"

# Only pods with this label reach polaris-pg (ADR-048 §3, charts/polaris-network-policies).
podLabels:
  lakehouse/polaris-pg-client: "true"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: polaris
            app.kubernetes.io/instance: polaris
        topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ~

managementService:
  ports:
    - name: polaris-mgmt
      port: 8182

# Metrics stay on as the chart defaults: /q/metrics on 8182 (ADR-046 §1). No ServiceMonitor:
# the chart renders one wherever the Prometheus Operator's CRD exists, and how the scraper
# finds Polaris is the observability team's; they get docs/contracts/ instead (ADR-046 §2).
serviceMonitor:
  enabled: false

realmContext:
  realms:
    - POLARIS

# PostgreSQL on CloudNativePG (ADR-008, ADR-010): the login from the Secret init_env.py
# creates (ADR-006); the JDBC URL from release.py, not from the Secret.
persistence:
  type: relational-jdbc
  relationalJdbc:
    secret:
      name: polaris-db
      username: username
      password: password
      jdbcUrl: ""

# The S3 credentials, typed into `.env` by hand (ADR-031). `storage.secret` reaches only
# Polaris's STS client; catalogs on S3 without STS (`stsUnavailable`) read and write with the
# AWS SDK's default credentials, so the same Secret is also passed as AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY. The catalog's properties never carry a key.
storage:
  secret:
    name: polaris-s3
    awsAccessKeyId: accessKeyId
    awsSecretAccessKey: secretAccessKey

extraEnv:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: polaris-s3
        key: accessKeyId
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: polaris-s3
        key: secretAccessKey
  # UTC, so the hourly rolls are named in UTC (ADR-036).
  - name: TZ
    value: UTC
  # Every JVM option Polaris runs with (ADR-061, ADR-062). The image's run-java.sh uses
  # JAVA_OPTS in place of its own defaults (the Parallel collector at 80% of memory,
  # GCTimeRatio 4), whose full pauses of up to 404 ms set one replica's read and mixed knees in
  # Tier D on 2026-10-16. Generational ZGC; JDK 24 and later drop -XX:+ZGenerational. The heap
  # share is a tuning value: at 70% of 8 GiB, ZGC's committed heap (5.84 GB) and 2.43 GB
  # outside it, with 1,590 requests in flight, were killed by the memory limit (2026-10-17).
  # 50% leaves about 4 GiB outside the heap, and the heap is still about 9 times the largest
  # heap after GC measured (451 MiB). gates/metrics.py reads this line.
  - name: JAVA_OPTS
    value: "-XX:MaxRAMPercentage=50.0 -XX:+UseZGC -XX:+ZGenerational -XX:+ExitOnOutOfMemoryError"

# Polaris issues its own tokens, signed with one key shared by every replica (ADR-026).
authentication:
  type: internal
  tokenBroker:
    type: symmetric-key
    secret:
      name: polaris-token-signing
      symmetricKey:
        secretKey: signingKey

# Polaris asks the OPA policy endpoint (ADR-026); its URL comes from release.py.
# Key names: docs/contracts/polaris-opa-input.md.
advancedConfig:
  polaris.authorization.type: opa
  # pgjdbc's client timeouts in seconds, passed to every new connection (ADR-047 §8). Without
  # them a connection to a lost node waits for TCP's own timeout: failover.yml's C0 kept its
  # pooled connection down for the whole 120 s node pause (#31). Connect 2 s and login 3 s as
  # C1 measured; socket 10 s where C1 had 5 s, because a query or commit running longer fails,
  # and synchronous commits wait on a standby under load (Kade, 2026-10-15). Tuning values
  # (ADR-000 rule 11); install/release.py reads these lines for the failover harness.
  quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout: "2"
  quarkus.datasource.jdbc.additional-jdbc-properties.loginTimeout: "3"
  quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout: "10"
  quarkus.datasource.jdbc.additional-jdbc-properties.tcpKeepAlive: "true"
