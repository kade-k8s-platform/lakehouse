# Every value here is a placeholder (ADR-000 rule 11) until the gate (L3) measures it or the
# observability team answers (the output). polaris-values.yaml repeats image, resources, the
# syslog port and the config map name as literals, since upstream's chart runs `tpl` over them;
# charts/test_polaris_log_sidecar.py keeps both equal.

# fluent/fluent-bit 5.1.4, tag and index digest read from Docker Hub 2026-10-30. The newest
# version at least two weeks old (5.1.5 was 9 days); 5.1.3 carries the octet-counting fixes.
image: fluent/fluent-bit:5.1.4@sha256:a9cc9627aeabb8bb33077ee85b6ec8c0fe40aff8e7000bb4e8cd924511fa626c

# The ConfigMap, and the volume of polaris-values.yaml that mounts it.
configMapName: polaris-log-sidecar

# Quarkus's syslog handler connects here, from the same pod (ADR-081 Decision 1). maxLength is
# Quarkus's `max-length`, above the 15 KB and 40 KB exception lines the contract measured so that
# a line is not cut into invalid JSON; it stays below the input's bufferMaxSize. queueLength is
# the depth of Quarkus's async queue, which drops when full instead of blocking a request thread.
# appName is the RFC 5424 APP-NAME (the syslog `ident`); the Java path Quarkus sends by default
# is 48 octets of noise. Quarkus counts the header in maxLength: the whole frame body is bounded,
# 165 octets of envelope (about 41 fewer with a short appName) and the 40 KB worst line included.
syslog:
  listen: 127.0.0.1
  port: 5140
  appName: polaris
  maxLength: 65536
  queueLength: 512

# ADR-082's routing. tagPrefix is the input's tag and the first segment of every stage and final
# tag (polaris.error.r1, polaris.candidate.r4, ...). Each rewrite_tag has its own emitter with a
# memory buffer of emitterMemBufLimit (ten of them; Fluent Bit's default of 10M each would be 100M
# of a 128Mi sidecar). 1MB lost lines of a 2000-line burst of 1 KiB lines in the smoke run (742
# arrived), so 8MB, the input's own limit; the emitters fill only as far as a burst needs.
routing:
  tagPrefix: polaris
  emitterMemBufLimit: 8MB

# The TCP input's caps. memBufLimit pauses the input, which backs up Polaris's queue until it
# discards. No storage.* anywhere: the buffer is memory only.
input:
  bufferChunkSize: 32KB
  bufferMaxSize: 128KB
  memBufLimit: 8MB

# The main Fluent Bit's input (tasks#2, destination a). Name, TLS and authentication wait for
# the observability team's answer; the host is the stand-in the gate builds.
output:
  host: main-fluent-bit-standin
  port: 24224
  tls: false
  tlsVerify: true
  retryLimit: 5
  requireAck: true

# The memory limit covers the buffer above (ADR-081 Consequences).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
